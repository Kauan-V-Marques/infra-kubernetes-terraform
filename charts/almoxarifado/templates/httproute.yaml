{{- if .Values.gateway.enabled }}
{{- $fullname := include "almox.fullname" . -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "almox.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
      sectionName: {{ .Values.gateway.httpsListener }}
  hostnames:
    - {{ .Values.hostname | quote }}
  # Mesmo endereço para o front e a API: o cookie de refresh continua same-site
  rules:
    - matches:
        - path: { type: PathPrefix, value: /api }
      backendRefs:
        - name: {{ $fullname }}-api
          port: 3333
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - name: {{ $fullname }}-web
          port: 80
{{- if .Values.gateway.redirectHttp }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullname }}-redireciona-https
  labels:
    {{- include "almox.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
      sectionName: {{ .Values.gateway.httpListener }}
  hostnames:
    - {{ .Values.hostname | quote }}
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
{{- end }}
{{- end }}
