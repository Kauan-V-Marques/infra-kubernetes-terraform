# Cluster local de 3 nós: 1 control plane + 2 workers (as réplicas se espalham entre eles)
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: almox
nodes:
  - role: control-plane
    image: kindest/node:v1.34.11@sha256:44e222ee2132dab25ff87301682f89eb82c7880ea3a1bf543bfe9708fd08d67d
    # As portas 80 e 443 da máquina caem nos NodePorts do Traefik (terraform/kind.tfvars)
    extraPortMappings:
      - containerPort: 30080
        hostPort: 80
        listenAddress: 127.0.0.1
        protocol: TCP
      - containerPort: 30443
        hostPort: 443
        listenAddress: 127.0.0.1
        protocol: TCP
  - role: worker
    image: kindest/node:v1.34.11@sha256:44e222ee2132dab25ff87301682f89eb82c7880ea3a1bf543bfe9708fd08d67d
  - role: worker
    image: kindest/node:v1.34.11@sha256:44e222ee2132dab25ff87301682f89eb82c7880ea3a1bf543bfe9708fd08d67d
